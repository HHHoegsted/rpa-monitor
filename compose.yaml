services:
  db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./api
    restart: unless-stopped

    depends_on:
      - db

    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: monitor_reader
      PGPASSWORD: ${MONITOR_READER_PASSWORD:?Reader password required}

    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped

    depends_on:
      - api

    ports:
      - "127.0.0.1:8080:80"

  collector:
    build:
      context: ./cpp
    restart: unless-stopped

    depends_on:
      - db

    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: monitor_writer
      PGPASSWORD: ${MONITOR_WRITER_PASSWORD:?Writer password required}

    ports:
      - "127.0.0.1:5000:5000"

volumes:
  postgres_data: