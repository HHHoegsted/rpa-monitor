listener 8883

allow_anonymous false
password_file /mosquitto/config/secrets/passwords
acl_file /mosquitto/config/secrets/acl.conf

certfile /mosquitto/config/secrets/server.crt
keyfile /mosquitto/config/secrets/server.key
tls_version tlsv1.2
require_certificate false

persistence true
persistence_location /mosquitto/data/

log_dest stdout